[package]
name = "zerodelta-risk-guard"
version = "1.0.0"
edition = "2021"
rust-version = "1.81"
description = "ZeroDelta on-chain Risk Guard: stores the delta/leverage/slippage policy and records approved rebalance attestations on NEAR."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.5.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

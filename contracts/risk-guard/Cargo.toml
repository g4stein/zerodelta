[package]
name = "zerodelta-risk-guard"
version = "2.0.0"
edition = "2021"
rust-version = "1.81"
description = "ZeroDelta on-chain Risk Guard: recomputes delta/leverage from raw order legs, binds them to the hedge payload, blocks replays, and is the only path to NEAR Chain Signatures for the treasury's hedge key."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.5.0"

[dev-dependencies]
near-sdk = { version = "=5.5.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
